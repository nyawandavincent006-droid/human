
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#10101b">
<title>HUMAN | Be Human. Be Real.</title>

<style>
*{box-sizing:border-box}
:root{
--bg:#f3f4f8;
--card:#fff;
--dark:#171725;
--pink:#ff3b65;
--muted:#77798b;
--line:#e9e9ef;
}
body{
margin:0;
font-family:system-ui,Arial,sans-serif;
background:var(--bg);
color:var(--dark);
}
header{
position:sticky;
top:0;
z-index:20;
background:#fff;
padding:12px 16px;
display:flex;
align-items:center;
justify-content:space-between;
box-shadow:0 2px 12px #0000000c;
}
.logo{font-size:27px;font-weight:950;letter-spacing:-1.5px}
.logo span{color:var(--pink)}
.wrap{max-width:650px;margin:auto;padding:14px}
.card{
background:var(--card);
border-radius:18px;
padding:16px;
margin-bottom:13px;
box-shadow:0 3px 15px #00000008;
}
input,textarea{
width:100%;
padding:13px;
border:1px solid var(--line);
border-radius:12px;
margin:6px 0;
font:inherit;
outline:none;
}
input:focus,textarea:focus{border-color:var(--pink)}
button{
border:0;
border-radius:12px;
padding:10px 14px;
font-weight:750;
cursor:pointer;
}
.primary{background:var(--pink);color:#fff}
.dark{background:var(--dark);color:#fff}
.light{background:#f0f0f5;color:var(--dark)}
.danger{background:#ffe5e9;color:#d60032}
.full{width:100%;margin-top:8px}
.tabs{display:flex;gap:7px;margin-bottom:12px}
.tabs button{flex:1;background:#e8e8ef}
.tabs button.active{background:var(--dark);color:#fff}
.hidden{display:none!important}
.avatar{
width:45px;height:45px;border-radius:50%;
background:linear-gradient(135deg,#ff3b65,#ff9b49);
color:white;display:flex;align-items:center;
justify-content:center;font-weight:900;
overflow:hidden;flex-shrink:0;
}
.avatar img{width:100%;height:100%;object-fit:cover}
.row{display:flex;align-items:center;gap:10px}
.muted{color:var(--muted);font-size:12px}
.post-text{white-space:pre-wrap;overflow-wrap:anywhere}
.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.actions button{flex:1;background:#f5f5f8}
.comment{
background:#f5f5f8;padding:10px;
border-radius:10px;margin-top:7px;
}
#toast{
position:fixed;top:70px;left:12px;right:12px;
background:#171725;color:#fff;padding:13px;
border-radius:13px;z-index:100;display:none;
}
.status{font-size:12px;color:var(--muted)}
@media(max-width:420px){
.wrap{padding:9px}
.card{padding:13px}
.tabs button{font-size:11px;padding:10px 4px}
}
</style>
</head>

<body>

<div id="toast"></div>

<header>
<div class="logo">HUMAN<span>.</span></div>
<div class="row">
<span id="connection" class="status">Connecting...</span>
<button class="light" onclick="refreshApp()">↻</button>
<div class="avatar" id="headerAvatar">?</div>
</div>
</header>

<div class="wrap">

<!-- AUTHENTICATION -->
<section id="authSection">

<div class="card" style="text-align:center">
<h1>Welcome to HUMAN<span style="color:#ff3b65">.</span></h1>
<p>Be Human. Be Real. ❤️</p>
<p class="muted">Your people. Your stories. Your space.</p>
</div>

<div class="card">
<div class="tabs">
<button id="loginTab" class="active" onclick="authMode('login')">LOGIN</button>
<button id="registerTab" onclick="authMode('register')">CREATE ACCOUNT</button>
</div>

<div id="registerFields" class="hidden">
<input id="regEmail" type="email" placeholder="Your real email address">
<input id="regUsername" placeholder="Choose a username">
<input id="regBio" placeholder="Tell people about yourself">
</div>

<div id="loginFields">
<input id="loginEmail" type="email" placeholder="Email address">
</div>

<input id="authPassword" type="password" placeholder="Password">

<button class="primary full" id="authButton" onclick="authenticate()">
LOGIN
</button>

<button class="light full" onclick="resetPassword()">
Forgot password?
</button>

<p id="authMessage" class="status"></p>
</div>
</section>

<!-- MAIN APPLICATION -->
<section id="appSection" class="hidden">

<div class="card">
<div class="row">
<div class="avatar" id="profileAvatar">?</div>
<div style="flex:1">
<b id="displayName">HUMAN Member</b>
<div class="muted" id="displayEmail"></div>
</div>
<button class="light" onclick="openProfile()">Profile</button>
</div>
</div>

<div class="tabs">
<button id="feedTab" class="active" onclick="showView('feed')">🌍 FEED</button>
<button id="savedTab" onclick="showView('saved')">🔖 SAVED</button>
<button id="profileTab" onclick="showView('profile')">👤 PROFILE</button>
</div>

<!-- FEED -->
<div id="feedView">

<div class="card">
<h3>Share your story 🌍</h3>
<input id="postTitle" placeholder="Give your post a title">
<textarea id="postText" rows="4" placeholder="What's happening?"></textarea>
<button class="primary full" onclick="createPost()">🚀 Publish post</button>
</div>

<div id="feed"></div>
</div>

<!-- SAVED -->
<div id="savedView" class="hidden">
<div class="card">
<h3>🔖 Your saved posts</h3>
<div id="savedPosts"></div>
</div>
</div>

<!-- PROFILE -->
<div id="profileView" class="hidden">
<div class="card">
<div style="text-align:center">
<div class="avatar" id="bigAvatar" style="width:85px;height:85px;margin:auto;font-size:28px">?</div>
<h2 id="profileUsername"></h2>
<p id="profileBio"></p>
</div>

<hr>

<b>Edit your profile</b>
<input id="editBio" placeholder="Your bio">
<input id="editAvatar" placeholder="Profile picture URL">

<button class="primary full" onclick="saveProfile()">Save changes</button>

<hr>

<button class="light full" onclick="resetPassword()">Change password through email</button>
<button class="danger full" onclick="logout()">Logout</button>
</div>
</div>

</section>
</div>

<!-- FIREBASE SDK -->
<script src="https://www.gstatic.com/firebasejs/12.6.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.6.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.6.0/firebase-database-compat.js"></script>

<script>

// ========================================
// HUMAN FIREBASE CONFIGURATION
// ========================================

const firebaseConfig = {
apiKey: "AIzaSyCFAciNfH_-OboP14XOMpeO7WRCAJecpHU",
authDomain: "human-app-cea91.firebaseapp.com",
databaseURL: "https://human-app-cea91-default-rtdb.firebaseio.com",
projectId: "human-app-cea91",
storageBucket: "human-app-cea91.firebasestorage.app",
messagingSenderId: "599977540407",
appId: "1:599977540407:web:0fecc148a25bce44a1f8b2",
measurementId: "G-K7FY30KW7Y"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const database = firebase.database();

let currentUser = null;
let currentProfile = null;
let posts = [];
let savedPosts = [];

let currentMode = "login";
let activeView = "feed";

// ========================================
// HELPERS
// ========================================

function toast(message){
const el=document.getElementById("toast");
el.textContent=message;
el.style.display="block";
setTimeout(()=>el.style.display="none",3500);
}

function safe(value){
return String(value ?? "").replace(/[&<>"']/g,char=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
})[char]);
}

function usernameValid(name){
return /^[a-zA-Z0-9_]{3,20}$/.test(name);
}

function profilePath(uid){
return database.ref("users/"+uid);
}

// ========================================
// AUTHENTICATION MODES
// ========================================

function authMode(mode){
currentMode=mode;

document.getElementById("loginTab").classList.toggle("active",mode==="login");
document.getElementById("registerTab").classList.toggle("active",mode==="register");

document.getElementById("registerFields").classList.toggle("hidden",mode!=="register");
document.getElementById("loginFields").classList.toggle("hidden",mode!=="login");

document.getElementById("authButton").textContent=
mode==="register"?"CREATE HUMAN ACCOUNT":"LOGIN";

document.getElementById("authMessage").textContent="";
}

// ========================================
// REGISTRATION AND LOGIN
// ========================================

async function authenticate(){

const button=document.getElementById("authButton");
const message=document.getElementById("authMessage");

const password=document.getElementById("authPassword").value.trim();

if(password.length<6){
message.textContent="Password must contain at least 6 characters.";
return;
}

button.disabled=true;
message.textContent="Please wait...";

try{

if(currentMode==="register"){

const email=document.getElementById("regEmail").value.trim();
const username=document.getElementById("regUsername").value.trim().toLowerCase();
const bio=document.getElementById("regBio").value.trim();

if(!email || !email.includes("@")){
throw new Error("Enter a valid email address.");
}

if(!usernameValid(username)){
throw new Error("Username must be 3-20 letters, numbers or underscores.");
}

const usernameRef=database.ref("usernameIndex/"+username);

const reservation=await usernameRef.transaction(current=>{
if(current===null)return auth.currentUser ? current : "__RESERVED__";
return;
});

if(!reservation.committed){
throw new Error("That username is already taken.");
}

let credential;

try{
credential=await auth.createUserWithEmailAndPassword(email,password);
await credential.user.sendEmailVerification();

const uid=credential.user.uid;

await profilePath(uid).set({
uid:uid,
username:username,
bio:bio,
avatar:"",
createdAt:firebase.database.ServerValue.TIMESTAMP,
verified:false
});

await usernameRef.set(uid);

toast("Account created! Please verify your email.");

}catch(error){
await usernameRef.remove().catch(()=>{});
if(auth.currentUser)await auth.currentUser.delete().catch(()=>{});
throw error;
}

}else{

const email=document.getElementById("loginEmail").value.trim();

if(!email)throw new Error("Enter your email.");

const credential=await auth.signInWithEmailAndPassword(email,password);

if(!credential.user.emailVerified){
await auth.signOut();
throw new Error("Verify your email first. Check your inbox.");
}

}

}catch(error){
message.textContent=error.message;
}finally{
button.disabled=false;
}

}

// ========================================
// PASSWORD RECOVERY
// ========================================

async function resetPassword(){

const email=currentUser
?currentUser.email
:document.getElementById("loginEmail").value.trim();

if(!email){
toast("Enter your email address first.");
return;
}

try{
await auth.sendPasswordResetEmail(email);
toast("Password reset email sent.");
}catch(error){
toast(error.message);
}

}

// ========================================
// AUTH STATE
// ========================================

auth.onAuthStateChanged(async user=>{

currentUser=user;

if(!user){
document.getElementById("authSection").classList.remove("hidden");
document.getElementById("appSection").classList.add("hidden");
document.getElementById("connection").textContent="Offline";
return;
}

if(!user.emailVerified){
await auth.signOut();
return;
}

try{

const snapshot=await profilePath(user.uid).once("value");

if(!snapshot.exists()){
toast("Account profile not found. Contact support.");
await auth.signOut();
return;
}

currentProfile=snapshot.val();

document.getElementById("authSection").classList.add("hidden");
document.getElementById("appSection").classList.remove("hidden");

document.getElementById("displayName").textContent="@"+currentProfile.username;
document.getElementById("displayEmail").textContent=user.email;
document.getElementById("profileUsername").textContent="@"+currentProfile.username;
document.getElementById("profileBio").textContent=currentProfile.bio||"No bio yet.";

updateAvatar();

loadSaved();
loadFeed();

}catch(error){
toast("Unable to load your profile: "+error.message);
}

});

// ========================================
// PROFILE
// ========================================

function updateAvatar(){

const avatar=currentProfile?.avatar||"";
const username=currentProfile?.username||"?";

const html=avatar
?'<img src="'+safe(avatar)+'" alt="Profile">'
:safe(username.charAt(0).toUpperCase());

["headerAvatar","profileAvatar","bigAvatar"].forEach(id=>{
document.getElementById(id).innerHTML=html;
});

document.getElementById("editBio").value=currentProfile.bio||"";
document.getElementById("editAvatar").value=avatar;

}

function openProfile(){
showView("profile");
}

async function saveProfile(){

if(!currentUser)return;

const bio=document.getElementById("editBio").value.trim();
const avatar=document.getElementById("editAvatar").value.trim();

try{

await profilePath(currentUser.uid).update({
bio:bio,
avatar:avatar
});

currentProfile.bio=bio;
currentProfile.avatar=avatar;

document.getElementById("profileBio").textContent=bio||"No bio yet.";

updateAvatar();
toast("Profile updated.");

}catch(error){
toast(error.message);
}

}

// ========================================
// NAVIGATION
// ========================================

function showView(view){

activeView=view;

["feedView","savedView","profileView"].forEach(id=>{
document.getElementById(id).classList.add("hidden");
});

document.getElementById(view+"View").classList.remove("hidden");

["feedTab","savedTab","profileTab"].forEach(id=>{
document.getElementById(id).classList.remove("active");
});

document.getElementById(view+"Tab").classList.add("active");

if(view==="saved")renderSaved();

if(view==="feed")loadFeed();

}

// ========================================
// CREATE POSTS
// ========================================

async function createPost(){

if(!currentUser)return;

const title=document.getElementById("postTitle").value.trim();
const text=document.getElementById("postText").value.trim();

if(!title&&!text){
toast("Write something first.");
return;
}

try{

const ref=database.ref("posts").push();

await ref.set({
id:ref.key,
uid:currentUser.uid,
name:currentProfile.username,
title:title,
text:text,
createdAt:firebase.database.ServerValue.TIMESTAMP,
likes:0,
love:0,
comments:{}
});

document.getElementById("postTitle").value="";
document.getElementById("postText").value="";

toast("Your story is live!");
loadFeed();

}catch(error){
toast("Post failed: "+error.message);
}

}

// ========================================
// LOAD FEED
// ========================================

async function loadFeed(){

if(!currentUser)return;

try{

const snapshot=await database.ref("posts")
.orderByChild("createdAt")
.limitToLast(100)
.once("value");

posts=[];

snapshot.forEach(child=>{
posts.unshift({...child.val(),id:child.key});
});

renderFeed();

}catch(error){
document.getElementById("feed").textContent="Unable to load feed: "+error.message;
}

}

// ========================================
// RENDER FEED
// ========================================

function renderFeed(){

const container=document.getElementById("feed");

if(!posts.length){
container.innerHTML='<div class="card">No posts yet. Start the conversation!</div>';
return;
}

container.innerHTML=posts.map(post=>{

const mine=post.uid===currentUser.uid;
const comments=Object.entries(post.comments||{});

return `
<div class="card">

<div class="row">
<div class="avatar">${safe((post.name||"H").charAt(0).toUpperCase())}</div>
<div>
<b>@${safe(post.name||"HUMAN")}</b>
<div class="muted">${post.createdAt?new Date(post.createdAt).toLocaleString():"Just now"}</div>
</div>
</div>

${post.title?`<h3>${safe(post.title)}</h3>`:""}
<p class="post-text">${safe(post.text||"")}</p>

<div class="actions">
<button onclick="reactPost('${post.id}','likes')">❤️ ${post.likes||0}</button>
<button onclick="reactPost('${post.id}','love')">😍 ${post.love||0}</button>
<button onclick="toggleSave('${post.id}')">🔖 Save</button>
${mine?`<button onclick="deletePost('${post.id}')">🗑️ Delete</button>`:""}
</div>

<hr>

<b>Comments (${comments.length})</b>

${comments.map(([id,comment])=>`
<div class="comment">
<b>@${safe(comment.name||"HUMAN")}</b>
<p>${safe(comment.text)}</p>
${comment.uid===currentUser.uid?
`<button class="danger" onclick="deleteComment('${post.id}','${id}')">Delete</button>`:""}
</div>
`).join("")}

<div class="row" style="margin-top:10px">
<input id="comment-${post.id}" placeholder="Write a comment...">
<button class="primary" onclick="addComment('${post.id}')">Send</button>
</div>

</div>
`;

}).join("");

}

// ========================================
// REACTIONS
// ========================================

async function reactPost(postId,type){

try{

const ref=database.ref("posts/"+postId+"/"+type);

await ref.transaction(value=>(value||0)+1);

loadFeed();

}catch(error){
toast(error.message);
}

}

// ========================================
// COMMENTS
// ========================================

async function addComment(postId){

const input=document.getElementById("comment-"+postId);
const text=input.value.trim();

if(!text)return;

try{

await database.ref("posts/"+postId+"/comments").push().set({
uid:currentUser.uid,
name:currentProfile.username,
text:text,
createdAt:firebase.database.ServerValue.TIMESTAMP
});

input.value="";
loadFeed();

}catch(error){
toast(error.message);
}

}

async function deleteComment(postId,commentId){

try{

const ref=database.ref("posts/"+postId+"/comments/"+commentId);
const snapshot=await ref.once("value");

if(snapshot.val()?.uid!==currentUser.uid){
throw new Error("You cannot delete another person's comment.");
}

await ref.remove();
loadFeed();

}catch(error){
toast(error.message);
}

}

// ========================================
// DELETE POSTS
// ========================================

async function deletePost(postId){

const post=posts.find(p=>p.id===postId);

if(!post||post.uid!==currentUser.uid){
toast("You can only delete your own posts.");
return;
}

if(!confirm("Delete this post?"))return;

try{
await database.ref("posts/"+postId).remove();
toast("Post deleted.");
loadFeed();
}catch(error){
toast(error.message);
}

}

// ========================================
// SAVED POSTS
// ========================================

function loadSaved(){

database.ref("saved/"+currentUser.uid).on("value",snapshot=>{
savedPosts=snapshot.val()||{};
if(activeView==="saved")renderSaved();
});

}

async function toggleSave(postId){

const ref=database.ref("saved/"+currentUser.uid+"/"+postId);
const snapshot=await ref.once("value");

if(snapshot.exists()){
await ref.remove();
toast("Removed from saved posts.");
}else{
await ref.set(true);
toast("Post saved.");
}

}

function renderSaved(){

const container=document.getElementById("savedPosts");

const list=posts.filter(post=>savedPosts[post.id]);

container.innerHTML=list.length
?list.map(post=>`
<div class="comment">
<b>@${safe(post.name)}</b>
<p>${safe(post.title||post.text||"")}</p>
<button class="light" onclick="toggleSave('${post.id}')">Remove saved</button>
</div>
`).join("")
:"No saved posts yet.";

}

// ========================================
// REFRESH AND LOGOUT
// ========================================

async function refreshApp(){

if(!currentUser)return;

await loadFeed();
toast("HUMAN refreshed.");

}

async function logout(){

if(!confirm("Log out of HUMAN?"))return;

await auth.signOut();
currentProfile=null;
posts=[];
toast("Logged out successfully.");

}

// ========================================
// CONNECTION STATUS
// ========================================

database.ref(".info/connected").on("value",snapshot=>{

document.getElementById("connection").textContent=
snapshot.val()?"🟢 Connected":"🔴 Offline";

});

</script>
</body>
</html>
