<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HUMAN - Be Human</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f0f2f5}
header{background:#fff;padding:12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;box-shadow:0 1px 5px #0001}
.logo{font-size:26px;font-weight:900}.logo span{color:#ff3b5c}
.btn{background:#111;color:#fff;border:0;padding:10px 14px;border-radius:20px;font-weight:700;cursor:pointer}
.btn-pink{background:#ff3b5c!important;color:#fff!important}
.wrap{max-width:520px;margin:0 auto;padding:12px}
.card{background:#fff;border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px #0001}
input,textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;margin:5px 0;font-size:15px}
.ava{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#ff3b5c,#ff9a00);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;overflow:hidden;flex-shrink:0}.ava img{width:100%;height:100%;object-fit:cover}
.actions{display:flex;gap:6px;margin-top:10px}.actions button{flex:1;border:1px solid #eee;background:#f8f8f8;padding:9px;border-radius:20px;cursor:pointer;font-weight:600}
.comment{background:#f5f5f5;padding:8px 10px;border-radius:12px;margin-top:6px;font-size:14px}
.status{font-size:12px;text-align:center;padding:6px;color:#666}
.mood-row{display:flex;gap:6px;flex-wrap:wrap}.mood-row button{border:1px solid #ddd;background:#fff;padding:7px 10px;border-radius:20px;cursor:pointer}.mood-row button.sel{background:#ff3b5c;color:#fff}
.poll-opt{background:#f0f0f0;padding:10px;border-radius:12px;margin:5px 0;cursor:pointer;position:relative;overflow:hidden}.poll-bar{position:absolute;left:0;top:0;bottom:0;background:#ff3b5c33}
.challenge{background:linear-gradient(135deg,#6a11cb,#2575fc);color:#fff;border-radius:18px;padding:16px;margin-bottom:12px}
.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button{flex:1;padding:12px;border-radius:14px;border:0;font-weight:800;cursor:pointer;background:#ddd}.tabs button.on{background:#111;color:#fff}
.chat-box{height:250px;overflow-y:auto;background:#f9f9f9;padding:10px;border-radius:14px;margin-bottom:8px}
.msg{background:#fff;padding:8px 12px;border-radius:14px;margin:5px 0;max-width:85%}.msg.me{background:#111;color:#fff;margin-left:auto}
.preview{width:100%;border-radius:14px;margin-top:8px;display:none}
</style>
</head>
<body>
<header><div class="logo">HUMAN<span>.</span></div><div>👤 <b id="myName">Guest</b></div></header>
<div class="wrap">
<div class="tabs"><button id="tabFeed" class="on" onclick="showTab('feed')">🌍 FEED</button><button id="tabChat" onclick="showTab('chat')">💬 CHAT</button></div>
<div id="feedView">
<div class="challenge"><small>✨ TODAY'S QUESTION</small><h3 id="dailyQ">What made you smile today?</h3></div>
<div class="card">
<b>🌍 Post to the World</b><div class="status" id="status">Connecting...</div>
<input id="nameInput" placeholder="Your name">
<input type="file" id="avaFile" accept="image/*" onchange="uploadAva(this)">
<input id="avaInput" placeholder="Or photo link">
<div class="mood-row"><button onclick="setMood('😊 Happy',this)">😊 Happy</button><button onclick="setMood('😢 Sad',this)">😢 Sad</button><button onclick="setMood('🔥 Motivated',this)">🔥 Motivated</button><button onclick="setMood('😍 In Love',this)">😍 In Love</button></div>
<label><input type="checkbox" id="anonCheck" style="width:auto"> 🎭 Anonymous</label>
<input id="titleInput" placeholder="Title...">
<textarea id="textInput" rows="3" placeholder="Write your story..."></textarea>
<label>📸 Post Photo:</label><input type="file" id="imgFile" accept="image/*" onchange="uploadImg(this)"><img id="imgPreview" class="preview">
<input id="imgInput" placeholder="Or image link">
<input id="pollInput" placeholder="📊 Poll? Question? | Option1 | Option2">
<button class="btn btn-pink" id="postBtn" onclick="makePost()" style="width:100%">🚀 POST TO THE WORLD</button>
</div>
<div style="display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap">
<button class="btn" onclick="setFilter('all')">🌍 All</button><button class="btn" onclick="setFilter('top')">🔥 Top</button><button class="btn" onclick="setFilter('mine')">👤 Mine</button><button class="btn" onclick="setFilter('anon')">🎭 Anonymous</button><button class="btn" onclick="setFilter('poll')">📊 Polls</button>
</div>
<div id="feed"></div>
</div>
<div id="chatView" style="display:none">
<div class="card"><b>💬 GLOBAL CHAT</b><div class="chat-box" id="chatBox">Loading chat...</div><div style="display:flex;gap:6px"><input id="chatInput" placeholder="Type message..."><button class="btn btn-pink" onclick="sendChat()">Send</button></div></div>
<div class="card"><b>👥 People</b><div id="peopleList"></div></div>
</div>
</div>
<script>
var BASE="https://human-app-cea91-default-rtdb.firebaseio.com";
var DB=BASE+"/posts"; var CHATDB=BASE+"/chats";
var posts=[]; var chats=[]; var filter='all'; var selMood='';
var QUESTIONS=["What made you smile today?","What is your biggest dream?","What are you grateful for?","If you had 1M KES what would you do?","What makes you feel alive?"];
document.getElementById('dailyQ').textContent=QUESTIONS[new Date().getDate()%QUESTIONS.length];
var myName=localStorage.getItem('human_name')||''; var myAva=localStorage.getItem('human_ava')||'';
if(myName){document.getElementById('myName').textContent=myName; document.getElementById('nameInput').value=myName; document.getElementById('avaInput').value=myAva;}
function showTab(t){document.getElementById('feedView').style.display=(t==='feed'?'block':'none'); document.getElementById('chatView').style.display=(t==='chat'?'block':'none'); document.getElementById('tabFeed').className=(t==='feed'?'on':''); document.getElementById('tabChat').className=(t==='chat'?'on':''); if(t==='chat') loadChat();}
function setFilter(f){filter=f; alert('Filter: '+f+' - showing '+posts.length+' posts'); render();}
function setMood(m,el){selMood=m; var b=document.querySelectorAll('.mood-row button'); for(var i=0;i<b.length;i++) b[i].classList.remove('sel'); el.classList.add('sel');}
function uploadAva(inp){var f=inp.files[0]; if(!f) return; var r=new FileReader(); r.onload=function(e){document.getElementById('avaInput').value=e.target.result; alert('✅ Profile photo ready');}; r.readAsDataURL(f);}
function uploadImg(inp){var f=inp.files[0]; if(!f) return; var r=new FileReader(); r.onload=function(e){document.getElementById('imgInput').value=e.target.result; var p=document.getElementById('imgPreview'); p.src=e.target.result; p.style.display='block';}; r.readAsDataURL(f);}
async function load(){try{var r=await fetch(DB+'.json'); var d=await r.json()||{}; posts=Object.keys(d).map(function(k){var o=d[k]; o._key=k; return o;}).sort(function(a,b){return b.time-a.time}); document.getElementById('status').textContent='✅ '+posts.length+' posts - Tap All/Top/Mine to filter'; render(); renderPeople();}catch(e){document.getElementById('status').textContent='⚠️ Offline '+e.message;}}
async function loadChat(){try{var r=await fetch(CHATDB+'.json'); var d=await r.json()||{}; chats=Object.keys(d).map(function(k){var o=d[k]; o._key=k; return o;}).sort(function(a,b){return a.time-b.time}).slice(-50); var box=document.getElementById('chatBox'); box.innerHTML=''; for(var i=0;i<chats.length;i++){var c=chats[i]; var div=document.createElement('div'); div.className='msg'+(c.name===myName?' me':''); div.innerHTML='<b>'+c.name+':</b> '+c.text; box.appendChild(div);} if(chats.length===0) box.innerHTML='No messages yet. Be first!'; box.scrollTop=box.scrollHeight;}catch(e){document.getElementById('chatBox').innerHTML='Chat offline';}}
async function sendChat(){var txt=document.getElementById('chatInput').value.trim(); if(!txt){alert('Type a message first'); return;} var name=document.getElementById('nameInput').value.trim()||myName||'Guest'; if(name!=='Guest'){localStorage.setItem('human_name',name); myName=name; document.getElementById('myName').textContent=name;} await fetch(CHATDB+'.json',{method:'POST',body:JSON.stringify({name:name,text:txt,time:Date.now()})}); document.getElementById('chatInput').value=''; loadChat();}
function chatTo(name){showTab('chat'); document.getElementById('chatInput').value='@'+name+' '; document.getElementById('chatInput').focus();}
function renderPeople(){var seen={}; for(var i=0;i<posts.length;i++){var p=posts[i]; if(p.name && !p.anon) seen[p.name]=p.ava||'';} var h=''; for(var n in seen){h+='<div style="display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid #eee"><div class="ava" style="width:32px;height:32px;font-size:14px">'+(seen[n]?'<img src="'+seen[n]+'">':n.charAt(0).toUpperCase())+'</div><b>'+n+'</b><button class="btn" style="padding:4px 10px;font-size:12px;margin-left:auto" onclick="chatTo(\''+n+'\')">💬 Chat</button></div>';} document.getElementById('peopleList').innerHTML=h||'No people yet';}
async function makePost(){var btn=document.getElementById('postBtn'); btn.textContent='⏳ Posting...'; try{var anon=document.getElementById('anonCheck').checked; var name=anon?'Anonymous 🎭':(document.getElementById('nameInput').value.trim()||'Guest'); var ava=anon?'':document.getElementById('avaInput').value.trim(); var title=document.getElementById('titleInput').value.trim(); var text=document.getElementById('textInput').value.trim(); var img=document.getElementById('imgInput').value.trim(); var pollRaw=document.getElementById('pollInput').value.trim(); var poll=null; if(pollRaw.indexOf('|')>-1){var parts=pollRaw.split('|').map(function(s){return s.trim()}); poll={q:parts[0],opts:parts.slice(1).map(function(t){return {t:t,votes:0}})};} if(!title && !text && !poll && !img){alert('Write something first!'); btn.textContent='🚀 POST TO THE WORLD'; return;} if(!anon){localStorage.setItem('human_name',name); localStorage.setItem('human_ava',ava); myName=name; document.getElementById('myName').textContent=name;} var res=await fetch(DB+'.json',{method:'POST',body:JSON.stringify({name:name,ava:ava,title:title,text:text,img:img,mood:selMood,anon:anon,poll:poll,likes:0,love:0,hug:0,wow:0,comments:[],time:Date.now()})}); if(!res.ok) throw new Error('Firebase '+res.status); alert('✅ POSTED! Scroll down to see it'); document.getElementById('titleInput').value=''; document.getElementById('textInput').value=''; document.getElementById('imgInput').value=''; document.getElementById('pollInput').value=''; document.getElementById('imgPreview').style.display='none'; await load();}catch(e){alert('❌ FAILED: '+e.message);} btn.textContent='🚀 POST TO THE WORLD';}
async function deletePost(k){if(!confirm('Delete this post?')) return; await fetch(DB+'/'+k+'.json',{method:'DELETE'}); load();}
async function editPost(k){var p=null; for(var i=0;i<posts.length;i++) if(posts[i]._key===k) p=posts[i]; var nt=prompt('Edit text:',p.text||''); if(nt===null) return; await fetch(DB+'/'+k+'.json',{method:'PATCH',body:JSON.stringify({text:nt})}); load();}
async function react(k,type){var p=null; for(var i=0;i<posts.length;i++) if(posts[i]._key===k) p=posts[i]; p[type]=(p[type]||0)+1; var o={}; o[type]=p[type]; await fetch(DB+'/'+k+'.json',{method:'PATCH',body:JSON.stringify(o)}); load();}
async function vote(k,idx){var p=null; for(var i=0;i<posts.length;i++) if(posts[i]._key===k) p=posts[i]; p.poll.opts[idx].votes++; await fetch(DB+'/'+k+'.json',{method:'PATCH',body:JSON.stringify({poll:p.poll})}); load();}
async function addComment(k){var inp=document.getElementById('c-'+k); var txt=inp.value.trim(); if(!txt) return; var p=null; for(var i=0;i<posts.length;i++) if(posts[i]._key===k) p=posts[i]; p.comments=p.comments||[]; p.comments.push({name:myName||'Guest',text:txt}); await fetch(DB+'/'+k+'.json',{method:'PATCH',body:JSON.stringify({comments:p.comments})}); load();}
function render(){var list=[]; for(var i=0;i<posts.length;i++) list.push(posts[i]); if(filter==='top') list.sort(function(a,b){return ((b.likes||0)+(b.love||0))-((a.likes||0)+(a.love||0))}); if(filter==='anon') list=list.filter(function(p){return p.anon}); if(filter==='poll') list=list.filter(function(p){return p.poll}); if(filter==='mine') list=list.filter(function(p){return p.name===myName}); var h=''; for(var j=0;j<list.length;j++){var p=list[j]; var date=new Date(p.time).toLocaleString(); var total=p.poll?p.poll.opts.reduce(function(s,o){return s+o.votes},0):0; var pollHtml=''; if(p.poll){pollHtml='<div style="background:#f9f9ff;padding:10px;border-radius:12px"><b>📊 '+p.poll.q+'</b>'; for(var q=0;q<p.poll.opts.length;q++){var o=p.poll.opts[q]; var pct=total?Math.round(o.votes/total*100):0; pollHtml+='<div class="poll-opt" onclick="vote(\''+p._key+'\','+q+')"><div class="poll-bar" style="width:'+pct+'%"></div><span style="position:relative"><b>'+o.t+'</b> - '+o.votes+' votes ('+pct+'%)</span></div>';} pollHtml+='</div>';} var isMine=(p.name===myName && myName!==''); var ownHtml=isMine?'<div style="display:flex;gap:6px;margin-top:8px"><button onclick="editPost(\''+p._key+'\')">✏️ Edit</button><button onclick="deletePost(\''+p._key+'\')" style="color:red">🗑️ Delete</button><span>• Your post</span></div>':''; var comments=''; for(var c=0;c<(p.comments||[]).length;c++){comments+='<div class="comment"><b>'+p.comments[c].name+':</b> '+p.comments[c].text+'</div>';} h+='<div class="card"><div style="display:flex;gap:10px;align-items:center"><div class="ava">'+(p.anon?'🎭':(p.ava?'<img src="'+p.ava+'">':(p.name||'G').charAt(0).toUpperCase()))+'</div><div><b>'+p.name+'</b><br><small>'+date+'</small></div><button class="btn" style="margin-left:auto;padding:6px 10px;font-size:12px" onclick="chatTo(\''+p.name+'\')">💬</button></div><h3>'+(p.title||'')+'</h3><p>'+(p.text||'')+'</p>'+(p.img?'<img src="'+p.img+'" style="width:100%;border-radius:14px">':'')+pollHtml+ownHtml+'<div class="actions"><button onclick="react(\''+p._key+'\',\'likes\')">❤️ '+(p.likes||0)+'</button><button onclick="react(\''+p._key+'\',\'love\')">😍 '+(p.love||0)+'</button><button onclick="react(\''+p._key+'\',\'hug\')">🤗 '+(p.hug||0)+'</button><button onclick="react(\''+p._key+'\',\'wow\')">😮 '+(p.wow||0)+'</button></div>'+comments+'<div style="display:flex;gap:6px;margin-top:8px"><input id="c-'+p._key+'" placeholder="Comment..."><button class="btn" onclick="addComment(\''+p._key+'\')">Send</button></div></div>';} document.getElementById('feed').innerHTML=h||'<div class="card"><center>No posts for this filter. Try All.<br>Be first to post!</center></div>';}
load(); loadChat(); setInterval(load,5000); setInterval(loadChat,3000);
</script>
</body>
</html>
