<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HUMAN - Be Human</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f0f2f5;color:#111}
body.dark{background:#111;color:#fff}body.dark .card,body.dark header{background:#222;color:#fff}body.dark input,body.dark textarea{background:#333;color:#fff;border-color:#444}
header{background:#fff;padding:12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;box-shadow:0 1px 5px #0001;z-index:10}
.logo{font-size:26px;font-weight:900}.logo span{color:#ff3b5c}
.btn{background:#111;color:#fff;border:0;padding:10px 14px;border-radius:20px;font-weight:700;cursor:pointer}
body.dark .btn{background:#fff;color:#111}.btn-pink{background:#ff3b5c!important;color:#fff!important}
.wrap{max-width:520px;margin:0 auto;padding:12px}
.card{background:#fff;border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px #0001}
input,textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;margin:5px 0;font-size:15px}
.ava{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#ff3b5c,#ff9a00);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;overflow:hidden;flex-shrink:0}.ava img{width:100%;height:100%;object-fit:cover}
.actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}.actions button{flex:1;border:1px solid #eee;background:#f8f8f8;padding:9px;border-radius:20px;cursor:pointer;font-weight:600;min-width:55px}
body.dark .actions button{background:#333;color:#fff}
.comment{background:#f5f5f5;padding:8px 10px;border-radius:12px;margin-top:6px;font-size:14px}body.dark .comment{background:#333}
.status{font-size:12px;text-align:center;padding:6px;color:#666}
.mood-row{display:flex;gap:6px;flex-wrap:wrap}.mood-row button{border:1px solid #ddd;background:#fff;padding:7px 10px;border-radius:20px;cursor:pointer}.mood-row button.sel{background:#ff3b5c;color:#fff}
.poll-opt{background:#f0f0f0;padding:10px;border-radius:12px;margin:5px 0;cursor:pointer;position:relative;overflow:hidden}.poll-bar{position:absolute;left:0;top:0;bottom:0;background:#ff3b5c33}
.challenge{background:linear-gradient(135deg,#6a11cb,#2575fc);color:#fff;border-radius:18px;padding:16px;margin-bottom:12px}
.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button{flex:1;padding:12px;border-radius:14px;border:0;font-weight:800;cursor:pointer;background:#ddd}.tabs button.on{background:#111;color:#fff}
.chat-box{height:250px;overflow-y:auto;background:#f9f9f9;padding:10px;border-radius:14px;margin-bottom:8px}body.dark .chat-box{background:#333}
.msg{background:#fff;padding:8px 12px;border-radius:14px;margin:5px 0;max-width:85%;color:#111}.msg.me{background:#111;color:#fff;margin-left:auto}
.preview{width:100%;border-radius:14px;margin-top:8px;display:none}
.stories{display:flex;gap:10px;overflow-x:auto;padding:6px 0}.story{min-width:70px;text-align:center;font-size:11px;cursor:pointer}.story .ava{width:56px;height:56px;margin:0 auto;border:3px solid #ff3b5c}
.hashtag{color:#ff3b5c;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<header><div class="logo">HUMAN<span>.</span></div><div>👤 <b id="myName">Guest</b> <button class="btn" onclick="toggleDark()" style="padding:6px 10px">🌙</button></div></header>
<div class="wrap">
<div class="tabs"><button id="tabFeed" class="on" onclick="showTab('feed')">🌍 FEED</button><button id="tabChat" onclick="showTab('chat')">💬 CHAT</button><button id="tabSaved" onclick="showTab('saved')">🔖 SAVED</button></div>

<div id="feedView">
<div class="stories" id="stories"></div>
<div class="challenge"><small>✨ TODAY'S QUESTION</small><h3 id="dailyQ">What made you smile today?</h3><button class="btn" style="background:#fff;color:#111" onclick="useQuestion()">💬 Answer This</button></div>
<div class="card" style="background:#fff3cd"><b>🔥 TRENDING HASHTAGS:</b> <span id="trending">Loading...</span><br><small>Tap a hashtag to filter</small></div>
<div class="card">
<b>🌍 Post to the World</b><div class="status" id="status">Connecting...</div>
<input id="searchInput" placeholder="🔍 Search posts... type & press Search" onkeyup="if(event.key==='Enter') doSearch()">
<button class="btn" onclick="doSearch()" style="width:100%">🔍 SEARCH</button>
<input id="nameInput" placeholder="Your name">
<input type="file" accept="image/*" onchange="uploadAva(this)">
<input id="avaInput" placeholder="Or photo link">
<div class="mood-row"><button onclick="setMood('😊 Happy',this)">😊 Happy</button><button onclick="setMood('😢 Sad',this)">😢 Sad</button><button onclick="setMood('🔥 Motivated',this)">🔥 Motivated</button><button onclick="setMood('😍 In Love',this)">😍 In Love</button><button onclick="setMood('🤔 Thinking',this)">🤔 Thinking</button></div>
<label><input type="checkbox" id="anonCheck" style="width:auto"> 🎭 Anonymous</label>
<input id="titleInput" placeholder="Title... use #hashtag">
<textarea id="textInput" rows="3" placeholder="Write story... use #Kenya #Love etc"></textarea>
<input id="locInput" placeholder="📍 Location? e.g. Kisumu, Nairobi">
<label>📸 Post Photo:</label><input type="file" accept="image/*" onchange="uploadImg(this)"><img id="imgPreview" class="preview">
<input id="imgInput" placeholder="Or image link">
<input id="pollInput" placeholder="📊 Poll? Q? | Opt1 | Opt2">
<div style="display:flex;gap:6px"><button class="btn" onclick="quickStory('😂 Funny')">😂 Funny</button><button class="btn" onclick="quickStory('❤️ Love')">❤️ Love</button><button class="btn" onclick="quickStory('💡 Idea')">💡 Idea</button></div>
<button class="btn btn-pink" id="postBtn" onclick="makePost()" style="width:100%">🚀 POST TO THE WORLD</button>
</div>
<div style="display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap">
<button class="btn" onclick="setFilter('all')">🌍 All</button><button class="btn" onclick="setFilter('top')">🔥 Top</button><button class="btn" onclick="setFilter('mine')">👤 Mine</button><button class="btn" onclick="setFilter('anon')">🎭 Anon</button><button class="btn" onclick="setFilter('poll')">📊 Polls</button><button class="btn" onclick="setFilter('saved')">🔖 Saved</button><button class="btn" onclick="clearSearch()">❌ Clear</button>
</div>
<div id="feed"></div>
</div>

<div id="chatView" style="display:none">
<div class="card"><b>💬 GLOBAL CHAT</b><div class="chat-box" id="chatBox">Loading...</div><div style="display:flex;gap:6px"><input id="chatInput" placeholder="Type message..."><button class="btn btn-pink" onclick="sendChat()">Send</button></div></div>
<div class="card"><b>👥 People - Follow them</b><div id="peopleList"></div></div>
</div>

<div id="savedView" style="display:none"><div class="card"><b>🔖 Your Saved Posts</b><div id="savedList"></div></div></div>
</div>
<script>
var BASE="https://human-app-cea91-default-rtdb.firebaseio.com"; var DB=BASE+"/posts"; var CHATDB=BASE+"/chats";
var posts=[]; var chats=[]; var filter='all'; var selMood=''; var searchQ=''; var saved=JSON.parse(localStorage.getItem('human_saved')||'[]'); var following=JSON.parse(localStorage.getItem('human_follow')||'[]');
var QUESTIONS=["What made you smile today?","What is your biggest dream?","What are you grateful for?","If you had 1M KES what would you do?","What makes you feel alive?","What is Kisumu missing?","What is your secret talent?"];
document.getElementById('dailyQ').textContent=QUESTIONS[new Date().getDate()%QUESTIONS.length];
var myName=localStorage.getItem('human_name')||''; var myAva=localStorage.getItem('human_ava')||'';
if(myName){document.getElementById('myName').textContent=myName; document.getElementById('nameInput').value=myName; document.getElementById('avaInput').value=myAva;}
if(localStorage.getItem('human_dark')==='1') document.body.classList.add('dark');
function toggleDark(){document.body.classList.toggle('dark'); localStorage.setItem('human_dark',document.body.classList.contains('dark')?'1':'0');}
function useQuestion(){document.getElementById('titleInput').value='Today: '+document.getElementById('dailyQ').textContent; document.getElementById('textInput').focus();}
function quickStory(t){document.getElementById('titleInput').value=t+' Story'; document.getElementById('textInput').focus();}
function showTab(t){document.getElementById('feedView').style.display=(t==='feed'?'block':'none'); document.getElementById('chatView').style.display=(t==='chat'?'block':'none'); document.getElementById('savedView').style.display=(t==='saved'?'block':'none'); document.getElementById('tabFeed').className=(t==='feed'?'on':''); document.getElementById('tabChat').className=(t==='chat'?'on':''); document.getElementById('tabSaved').className=(t==='saved'?'on':''); if(t==='chat') loadChat(); if(t==='saved') renderSaved();}
function doSearch(){searchQ=document.getElementById('searchInput').value.trim().toLowerCase(); filter='all'; render(); document.getElementById('status').textContent=searchQ?'🔍 Search: "'+searchQ+'" - found '+posts.filter(function(p){return ((p.title||'')+' '+(p.text||'')).toLowerCase().indexOf(searchQ)>-1}).length+' posts':'Showing all';}
function clearSearch(){searchQ=''; document.getElementById('searchInput').value=''; filter='all'; render();}
function setFilter(f){filter=f; searchQ=''; var msg=''; if(f==='all') msg='🌍 ALL - '+posts.length+' posts, newest first'; if(f==='top') msg='🔥 TOP - Sorted by most reactions'; if(f==='mine') msg='👤 MINE - Only you ('+myName+') - '+posts.filter(function(p){return p.name===myName}).length+' posts'; if(f==='anon') msg='🎭 ANONYMOUS ONLY - '+posts.filter(function(p){return p.anon}).length+' posts'; if(f==='poll') msg='📊 POLLS ONLY - Tap to vote'; if(f==='saved') msg='🔖 SAVED - '+saved.length+' saved'; document.getElementById('status').textContent=msg; render();}
function setMood(m,el){selMood=m; var b=document.querySelectorAll('.mood-row button'); for(var i=0;i<b.length;i++) b[i].classList.remove('sel'); el.classList.add('sel');}
function uploadAva(inp){var f=inp.files[0]; if(!f) return; var r=new FileReader(); r.onload=function(e){document.getElementById('avaInput').value=e.target.result; alert('✅ Profile photo ready');}; r.readAsDataURL(f);}
function uploadImg(inp){var f=inp.files[0]; if(!f) return; var r=new FileReader(); r.onload=function(e){document.getElementById('imgInput').value=e.target.result; var p=document.getElementById('imgPreview'); p.src=e.target.result; p.style.display='block';}; r.readAsDataURL(f);}
function toggleSave(k){var idx=saved.indexOf(k); if(idx>-1){saved.splice(idx,1); alert('🔖 Unsaved');}else{saved.push(k); alert('🔖 Saved! Find it in SAVED tab');} localStorage.setItem('human_saved',JSON.stringify(saved)); render();}
function toggleFollow(name){var idx=following.indexOf(name); if(idx>-1){following.splice(idx,1); alert('Unfollowed '+name);}else{following.push(name); alert('⭐ Now following '+name+' - their posts will show ⭐');} localStorage.setItem('human_follow',JSON.stringify(following)); renderPeople(); render();}
function sharePost(k){var url=location.href.split('#')[0]+'#'+k; if(navigator.clipboard){navigator.clipboard.writeText(url); alert('🔗 Link copied! Send to friends: '+url);}else{prompt('Copy this link:',url);}}
function reportPost(k){if(confirm('Report this post as bad/spam?')){alert('🚩 Reported! Thank you. Admin will check.');}}
function filterHashtag(tag){searchQ=tag.toLowerCase(); document.getElementById('searchInput').value=tag; render(); document.getElementById('status').textContent=' #️⃣ Hashtag: '+tag;}
function formatText(t){if(!t) return ''; return t.replace(/#(\w+)/g,'<span class="hashtag" onclick="filterHashtag(\'#$1\')">#$1</span>');}
async function load(){try{var r=await fetch(DB+'.json'); var d=await r.json()||{}; posts=Object.keys(d).map(function(k){var o=d[k]; o._key=k; return o;}).sort(function(a,b){return b.time-a.time}); document.getElementById('status').textContent='✅ '+posts.length+' posts - '+following.length+' following - '+saved.length+' saved'; render(); renderPeople(); renderStories(); renderTrending();}catch(e){document.getElementById('status').textContent='⚠️ Offline';}}
function renderTrending(){var counts={}; posts.forEach(function(p){var txt=(p.title||'')+' '+(p.text||''); var m=txt.match(/#\w+/g); if(m) m.forEach(function(h){counts[h]=(counts[h]||0)+1});}); var sorted=Object.keys(counts).sort(function(a,b){return counts[b]-counts[a]}).slice(0,5); document.getElementById('trending').innerHTML=sorted.length?sorted.map(function(h){return '<span class="hashtag" onclick="filterHashtag(\''+h+'\')">'+h+' ('+counts[h]+')</span>'}).join(' '):'No hashtags yet. Be first to use #Kenya';}
function renderStories(){var seen={}; posts.forEach(function(p){if(!p.anon && p.name) seen[p.name]=p.ava||'';}); var h='<div class="story" onclick="setFilter(\'all\')"><div class="ava">➕</div>Your<br>Story</div>'; for(var n in seen){h+='<div class="story" onclick="searchPerson(\''+n+'\')"><div class="ava">'+(seen[n]?'<img src="'+seen[n]+'">':n.charAt(0))+'</div>'+n+'</div>';} document.getElementById('stories').innerHTML=h;}
function searchPerson(n){searchQ=n.toLowerCase(); document.getElementById('searchInput').value=n; render(); document.getElementById('status').textContent='👤 Posts by '+n;}
async function loadChat(){try{var r=await fetch(CHATDB+'.json'); var d=await r.json()||{}; chats=Object.keys(d).map(function(k){var o=d[k]; o._key=k; return o;}).sort(function(a,b){return a.time-b.time}).slice(-50); var box=document.getElementById('chatBox'); box.innerHTML=''; for(var i=0;i<chats.length;i++){var c=chats[i]; var div=document.createElement('div'); div.className='msg'+(c.name===myName?' me':''); div.innerHTML='<b>'+c.name+':</b> '+c.text; box.appendChild(div);} if(chats.length===0) box.innerHTML='No messages yet'; box.scrollTop=box.scrollHeight;}catch(e){}}
async function sendChat(){var txt=document.getElementById('chatInput').value.trim(); if(!txt){alert('Type first'); return;} var name=document.getElementById('nameInput').value.trim()||myName||'Guest'; if(name!=='Guest'){localStorage.setItem('human_name',name); myName=name; document.getElementById('myName').textContent=name;} await fetch(CHATDB+'.json',{method:'POST',body:JSON.stringify({name:name,text:txt,time:Date.now()})}); document.getElementById('chatInput').value=''; loadChat();}
function chatTo(name){showTab('chat'); document.getElementById('chatInput').value='@'+name+' '; document.getElementById('chatInput').focus();}
function renderPeople(){var seen={}; posts.forEach(function(p){if(p.name && !p.anon) seen[p.name]=p.ava||'';}); var h=''; for(var n in seen){var isF=following.indexOf(n)>-1; h+='<div style="display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid #eee"><div class="ava" style="width:32px;height:32px">'+(seen[n]?'<img src="'+seen[n]+'">':n.charAt(0))+'</div><b>'+n+'</b>'+(isF?' ⭐':'')+'<button class="btn" style="padding:4px 8px;font-size:11px;margin-left:auto" onclick="toggleFollow(\''+n+'\')">'+(isF?'Unfollow':'⭐ Follow')+'</button><button class="btn" style="padding:4px 8px;font-size:11px" onclick="chatTo(\''+n+'\')">💬</button></div>';} document.getElementById('peopleList').innerHTML=h||'No people yet';}
async function makePost(){var btn=document.getElementById('postBtn'); btn.textContent='⏳ Posting...'; try{var anon=document.getElementById('anonCheck').checked; var name=anon?'Anonymous 🎭':(document.getElementById('nameInput').value.trim()||'Guest'); var ava=anon?'':document.getElementById('avaInput').value.trim(); var title=document.getElementById('titleInput').value.trim(); var text=document.getElementById('textInput').value.trim(); var img=document.getElementById('imgInput').value.trim(); var loc=document.getElementById('locInput').value.trim(); var pollRaw=document.getElementById('pollInput').value.trim(); var poll=null; if(pollRaw.indexOf('|')>-1){var parts=pollRaw.split('|').map(function(s){return s.trim()}); poll={q:parts[0],opts:parts.slice(1).map(function(t){return {t:t,votes:0}})};} if(!title && !text && !poll && !img){alert('Write something!'); btn.textContent='🚀 POST TO THE WORLD'; return;} if(!anon){localStorage.setItem('human_name',name); localStorage.setItem('human_ava',ava); myName=name; document.getElementById('myName').textContent=name;} var res=await fetch(DB+'.json',{method:'POST',body:JSON.stringify({name:name,ava:ava,title:title,text:text,img:img,loc:loc,mood:selMood,anon:anon,poll:poll,likes:0,love:0,hug:0,wow:0,views:0,comments:[],time:Date.now()})}); if(!res.ok) throw new Error('Firebase '+res.status); alert('✅ POSTED!'); document.getElementById('titleInput').value=''; document.getElementById('textInput').value=''; document.getElementById('imgInput').value=''; document.getElementById('pollInput').value=''; document.getElementById('locInput').value=''; document.getElementById('imgPreview').style.display='none'; await load();}catch(e){alert('❌ '+e.message);} btn.textContent='🚀 POST TO THE WORLD';}
async function deletePost(k){if(!confirm('Delete?')) return; await fetch(DB+'/'+k+'.json',{method:'DELETE'}); load();}
async function editPost(k){var p=null; for(var i=0;i<posts.length;i++) if(posts[i]._key===k) p=posts[i]; var nt=prompt('Edit text:',p.text||''); if(nt===null) return; await fetch(DB+'/'+k+'.json',{method:'PATCH',body:JSON.stringify({text:nt})}); load();}
async function react(k,type){var p=null; for(var i=0;i<posts.length;i++) if(posts[i]._key===k) p=posts[i]; p[type]=(p[type]||0)+1; var o={}; o[type]=p[type]; await fetch(DB+'/'+k+'.json',{method:'PATCH',body:JSON.stringify(o)}); load();}
async function vote(k,idx){var p=null; for(var i=0;i<posts.length;i++) if(posts[i]._key===k) p=posts[i]; p.poll.opts[idx].votes++; await fetch(DB+'/'+k+'.json',{method:'PATCH',body:JSON.stringify({poll:p.poll})}); load();}
async function addComment(k){var inp=document.getElementById('c-'+k); var txt=inp.value.trim(); if(!txt) return; var p=null; for(var i=0;i<posts.length;i++) if(posts[i]._key===k) p=posts[i]; p.comments=p.comments||[]; p.comments.push({name:myName||'Guest',text:txt}); await fetch(DB+'/'+k+'.json',{method:'PATCH',body:JSON.stringify({comments:p.comments})}); load();}
function renderSaved(){var list=posts.filter(function(p){return saved.indexOf(p._key)>-1}); document.getElementById('savedList').innerHTML=list.length?list.map(function(p){return '<div style="padding:10px;border-bottom:1px solid #eee"><b>'+p.name+'</b><br>'+formatText(p.title||'')+'<br>'+formatText(p.text||'')+'</div>'}).join(''):'No saved yet. Tap 🔖 on any post';}
function render(){var list=[]; for(var i=0;i<posts.length;i++) list.push(posts[i]); if(searchQ) list=list.filter(function(p){return ((p.title||'')+' '+(p.text||'')+' '+(p.name||'')).toLowerCase().indexOf(searchQ)>-1}); else {if(filter==='top') list.sort(function(a,b){return ((b.likes||0)+(b.love||0))-((a.likes||0)+(a.love||0))}); if(filter==='anon') list=list.filter(function(p){return p.anon}); if(filter==='poll') list=list.filter(function(p){return p.poll}); if(filter==='mine') list=list.filter(function(p){return p.name===myName}); if(filter==='saved') list=list.filter(function(p){return saved.indexOf(p._key)>-1});} var h=''; for(var j=0;j<list.length;j++){var p=list[j]; var date=new Date(p.time).toLocaleString(); var total=p.poll?p.poll.opts.reduce(function(s,o){return s+o.votes},0):0; var pollHtml=''; if(p.poll){pollHtml='<div style="background:#f9f9ff;padding:10px;border-radius:12px"><b>📊 '+p.poll.q+'</b>'; for(var q=0;q<p.poll.opts.length;q++){var o=p.poll.opts[q]; var pct=total?Math.round(o.votes/total*100):0; pollHtml+='<div class="poll-opt" onclick="vote(\''+p._key+'\','+q+')"><div class="poll-bar" style="width:'+pct+'%"></div><span style="position:relative"><b>'+o.t+'</b> - '+o.votes+' votes ('+pct+'%)</span></div>';} pollHtml+='</div>';} var isMine=(p.name===myName && myName!==''); var isSaved=saved.indexOf(p._key)>-1; var isF=following.indexOf(p.name)>-1; var ownHtml=isMine?'<div style="display:flex;gap:6px;margin-top:8px"><button onclick="editPost(\''+p._key+'\')">✏️ Edit</button><button onclick="deletePost(\''+p._key+'\')" style="color:red">🗑️ Delete</button><span>• Your post</span></div>':''; var comments=''; for(var c=0;c<(p.comments||[]).length;c++){comments+='<div class="comment"><b>'+p.comments[c].name+':</b> '+p.comments[c].text+'</div>';} h+='<div class="card"><div style="display:flex;gap:10px;align-items:center"><div class="ava">'+(p.anon?'🎭':(p.ava?'<img src="'+p.ava+'">':(p.name||'G').charAt(0)))+'</div><div><b>'+p.name+(isF?' ⭐ FOLLOWING':'')+'</b><br><small>'+date+(p.loc?' • 📍 '+p.loc:'')+' • 👁️ '+(p.views||0)+' views</small></div><button class="btn" style="margin-left:auto;padding:6px 10px;font-size:12px" onclick="chatTo(\''+p.name+'\')">💬</button></div><h3>'+formatText(p.title||'')+'</h3><p>'+formatText(p.text||'')+'</p>'+(p.img?'<img src="'+p.img+'" style="width:100%;border-radius:14px">':'')+pollHtml+ownHtml+'<div class="actions"><button onclick="react(\''+p._key+'\',\'likes\')">❤️ '+(p.likes||0)+'</button><button onclick="react(\''+p._key+'\',\'love\')">😍 '+(p.love||0)+'</button><button onclick="react(\''+p._key+'\',\'hug\')">🤗 '+(p.hug||0)+'</button><button onclick="react(\''+p._key+'\',\'wow\')">😮 '+(p.wow||0)+'</button><button onclick="toggleSave(\''+p._key+'\')">'+(isSaved?'✅ Saved':'🔖 Save')+'</button><button onclick="sharePost(\''+p._key+'\')">🔗 Share</button><button onclick="reportPost(\''+p._key+'\')">🚩</button></div>'+comments+'<div style="display:flex;gap:6px;margin-top:8px"><input id="c-'+p._key+'" placeholder="Comment..."><button class="btn" onclick="addComment(\''+p._key+'\')">Send</button></div></div>';} document.getElementById('feed').innerHTML=h||'<div class="card"><center>No posts for this filter.<br>Try ALL or be first to post!</center></div>';}
load(); loadChat(); setInterval(load,5000); setInterval(loadChat,3000);
</script>
</body>
</html>
